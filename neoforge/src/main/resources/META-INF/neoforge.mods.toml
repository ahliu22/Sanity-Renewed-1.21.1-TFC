modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/croissantnova/SanityDescentIntoMadness/issues"

[[mods]]
    modId = "sanity_renewed"
    version = "${version}"
    displayName = "Sanity: Renewed For TFC"
    logoFile = "icon.png"
    description = '''Brings the sanity mechanic from Don't Starve into Minecraft mod TerraFirmaCraft. This mod is a modified version of Sanity: Renewed, do not install them together!'''
    authors = "ah_liu22"
    credits = "toujourspareil, Zapsplat,croissantnova, guivnf"

[[dependencies.sanity_renewed]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.1,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.sanity_renewed]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.1,1.22)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.sanity_renewed]]
    modId = "architectury"
    type = "required"
    versionRange = "[13,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.sanity_renewed]]
    modId = "geckolib"
    type = "required"
    versionRange = "[4.7,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.sanity_renewed]]
    modId = "tfc"
    type = "required"
    versionRange = "[4.0,)"
    ordering = "AFTER"
    side = "BOTH"

[[mixins]]
    config = "sanity_renewed.mixins.json"

[[mixins]]
    config = "sanity_renewed.neoforge.mixins.json"
